<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="title_cart">עגלת קניות | Eldora</title>

    <link rel="icon" type="image/svg+xml" href="images/logo.svg">

    <!-- גופנים, Bootstrap ואייקונים - שמורים בתיקייה vendor כדי שהאתר יעבוד גם בלי אינטרנט -->
    <!-- i18n.js מחליף לגרסה של Bootstrap משמאל לימין כשנבחרה אנגלית -->
    <link rel="stylesheet" href="vendor/fonts/fonts.css">
    <link rel="stylesheet" id="bootstrap-css" href="vendor/bootstrap/bootstrap.rtl.min.css">
    <script src="js/i18n.js"></script>
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">

    <!-- קובץ העיצוב שלנו - תמיד אחרון -->
    <link rel="stylesheet" href="css/style.css">

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/user.js"></script>
</head>

<body>

    <main class="container cart-page py-5">

        <h1 class="page-title" data-i18n="cart_title">סל הקניות</h1>
        <p class="page-subtitle"><span class="user-name"></span><span data-i18n="cart_sub">, אלה התכשיטים שבסל שלך</span></p>

        <div class="row g-4 g-lg-5">

            <!-- JS מכניס לכאן את המוצרים שבעגלה -->
            <div class="col-lg-8">
                <div id="cart-items" class="cart-list"></div>
            </div>

            <!-- סיכום -->
            <div class="col-lg-4">
                <div class="summary-box">

                    <h2 data-i18n="summary_title">סיכום הזמנה</h2>

                    <div class="summary-row">
                        <span data-i18n="items_count">מספר פריטים</span>
                        <span id="cart-count">0</span>
                    </div>
                    <div class="summary-row">
                        <span data-i18n="subtotal">סכום ביניים</span>
                        <span id="cart-subtotal">0 ₪</span>
                    </div>
                    <div class="summary-row">
                        <span data-i18n="shipping">משלוח</span>
                        <span id="cart-shipping">0 ₪</span>
                    </div>
                    <p id="free-shipping-note" class="shipping-note"></p>

                    <!-- אריזת מתנה -->
                    <div class="gift-box" id="gift-box">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="gift-wrap">
                            <label class="form-check-label" for="gift-wrap">
                                <span data-i18n="gift_wrap">אריזת מתנה</span>
                                <span class="text-muted-soft" id="gift-wrap-price"></span>
                            </label>
                        </div>
                        <textarea id="gift-message" class="form-control mt-2 d-none" rows="2" maxlength="120"
                                  placeholder="ברכה לכרטיס (לא חובה)" data-i18n-placeholder="gift_message_placeholder"></textarea>
                    </div>
                    <div class="summary-row d-none" id="gift-row">
                        <span data-i18n="gift_wrap">אריזת מתנה</span>
                        <span id="cart-gift">0 ₪</span>
                    </div>

                    <div class="summary-total">
                        <span data-i18n="total">סה"כ</span>
                        <strong id="cart-total">0 ₪</strong>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <a id="checkout-link" href="checkout.html" class="btn btn-dark" data-i18n="to_checkout">מעבר לתשלום</a>
                        <a href="shop.html" class="btn btn-outline-dark" data-i18n="continue_shopping">המשך קניות</a>
                    </div>

                    <div class="text-center mt-3">
                        <button id="clear-cart" type="button" class="link-action danger" data-i18n="clear_cart">ריקון העגלה</button>
                    </div>

                </div>
            </div>

        </div>

    </main>

    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>

</body>

</html>
