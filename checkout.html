<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>סיום הזמנה | Jewelry Shop</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- קובץ העיצוב שלנו -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- תפריט עליון -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold" href="shop.html">
                JEWELRY SHOP
            </a>

            <span id="welcomeUser" class="text-secondary"></span>

        </div>
    </nav>


    <main class="container checkout-container">

        <div class="text-center mb-5">

            <h1 class="checkout-title">
                סיום הזמנה
            </h1>

            <p class="text-secondary">
                מלאי את הפרטים וההזמנה שלך בדרך אלייך
            </p>

        </div>


        <!-- הודעת הצלחה -->
        <div
            id="successMessage"
            class="alert alert-success text-center d-none">
        </div>


        <div class="row g-4">

            <!-- ===================== -->
            <!-- פרטי לקוח -->
            <!-- ===================== -->

            <div class="col-lg-7">

                <div class="card checkout-card">

                    <div class="card-body p-4">

                        <h4 class="mb-4">
                            פרטי משלוח
                        </h4>


                        <form id="checkoutForm">

                            <!-- שם מלא -->

                            <div class="mb-3">

                                <label
                                    for="fullName"
                                    class="form-label">

                                    שם מלא

                                </label>

                                <input
                                    type="text"
                                    id="fullName"
                                    class="form-control"
                                    placeholder="הכניסי שם מלא"
                                    required>

                            </div>


                            <!-- טלפון -->

                            <div class="mb-3">

                                <label
                                    for="phone"
                                    class="form-label">

                                    מספר טלפון

                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    class="form-control"
                                    placeholder="0501234567"
                                    required>

                            </div>


                            <!-- כתובת -->

                            <div class="mb-3">

                                <label
                                    for="address"
                                    class="form-label">

                                    כתובת למשלוח

                                </label>

                                <input
                                    type="text"
                                    id="address"
                                    class="form-control"
                                    placeholder="רחוב, מספר בית ועיר"
                                    required>

                            </div>


                            <hr class="my-4">


                            <!-- ===================== -->
                            <!-- תשלום -->
                            <!-- ===================== -->

                            <h4 class="mb-4">
                                פרטי תשלום
                            </h4>


                            <!-- מספר כרטיס -->

                            <div class="mb-3">

                                <label
                                    for="cardNumber"
                                    class="form-label">

                                    מספר כרטיס אשראי

                                </label>

                                <input
                                    type="text"
                                    id="cardNumber"
                                    class="form-control"
                                    maxlength="19"
                                    placeholder="1234 5678 9012 3456"
                                    required>

                            </div>


                            <div class="row">

                                <!-- תוקף -->

                                <div class="col-md-6 mb-3">

                                    <label
                                        for="expiry"
                                        class="form-label">

                                        תוקף

                                    </label>

                                    <input
                                        type="text"
                                        id="expiry"
                                        class="form-control"
                                        maxlength="5"
                                        placeholder="MM/YY"
                                        required>

                                </div>


                                <!-- CVV -->

                                <div class="col-md-6 mb-3">

                                    <label
                                        for="cvv"
                                        class="form-label">

                                        CVV

                                    </label>

                                    <input
                                        type="password"
                                        id="cvv"
                                        class="form-control"
                                        maxlength="3"
                                        placeholder="123"
                                        required>

                                </div>

                            </div>


                            <!-- כפתור תשלום -->

                            <button
                                type="submit"
                                id="payButton"
                                class="btn btn-dark w-100 py-2 mt-3">

                                ביצוע הזמנה

                            </button>

                        </form>

                    </div>
                </div>
            </div>


            <!-- ===================== -->
            <!-- סיכום הזמנה -->
            <!-- ===================== -->

            <div class="col-lg-5">

                <div class="card checkout-card">

                    <div class="card-body p-4">

                        <h4 class="mb-4">
                            סיכום ההזמנה
                        </h4>


                        <!-- JS יכניס לכאן את המוצרים -->

                        <div id="orderSummary"></div>


                        <hr>


                        <div
                            class="d-flex justify-content-between align-items-center">

                            <span class="fs-5">
                                סה"כ לתשלום
                            </span>

                            <strong
                                id="totalPrice"
                                class="fs-4">

                                0 ₪

                            </strong>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="js/checkout.js"></script>

</body>
</html>
