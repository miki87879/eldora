<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="title_checkout">סיום הזמנה | Eldora</title>

    <link rel="icon" type="image/svg+xml" href="images/logo.svg">

    <!-- גופנים, Bootstrap ואייקונים - שמורים בתיקייה vendor כדי שהאתר יעבוד גם בלי אינטרנט -->
    <!-- i18n.js מחליף לגרסה של Bootstrap משמאל לימין כשנבחרה אנגלית -->
    <link rel="stylesheet" href="vendor/fonts/fonts.css">
    <link rel="stylesheet" id="bootstrap-css" href="vendor/bootstrap/bootstrap.rtl.min.css">
    <script src="js/i18n.js"></script>
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">

    <!-- קובץ העיצוב שלנו - תמיד אחרון -->
    <link rel="stylesheet" href="css/style.css">

    <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/user.js"></script>
</head>

<body>

    <main class="container checkout-container py-5">

        <h1 class="page-title" data-i18n="checkout_title">סיום הזמנה</h1>
        <p class="page-subtitle" data-i18n="checkout_sub">עוד רגע והתכשיטים בדרך אלייך</p>


        <!-- מוצג כשהסל ריק -->
        <div id="emptyCheckout" class="empty-state d-none">
            <h3 data-i18n="empty_checkout_title">אין מוצרים לתשלום</h3>
            <p data-i18n="empty_checkout_text">הסל ריק.</p>
            <a href="shop.html" class="btn btn-dark" data-i18n="all_jewelry">לכל התכשיטים</a>
        </div>


        <div id="checkoutContent" class="row g-4 g-lg-5">

            <!-- ===================== -->
            <!-- פרטי לקוח -->
            <!-- ===================== -->

            <div class="col-lg-7">

                <div>

                    <div>

                        <form id="checkoutForm" novalidate>

                            <h2 class="checkout-step"><span class="step-num">01</span> <span data-i18n="step_shipping">פרטי משלוח</span></h2>

                            <!-- שם מלא -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label" data-i18n="full_name">שם מלא</label>
                                <input type="text" id="fullName" class="form-control" placeholder="הכניסי שם מלא" data-i18n-placeholder="checkout_name_placeholder"
                                       autocomplete="name" required>
                                <div class="invalid-feedback"></div>
                            </div>

                            <!-- טלפון -->
                            <div class="mb-3">
                                <label for="phone" class="form-label" data-i18n="phone">מספר טלפון</label>
                                <input type="tel" id="phone" class="form-control" placeholder="0501234567"
                                       inputmode="tel" autocomplete="tel" dir="ltr" required>
                                <div class="invalid-feedback"></div>
                            </div>

                            <!-- כתובת -->
                            <div class="mb-3">
                                <label for="address" class="form-label" data-i18n="address">כתובת למשלוח</label>
                                <input type="text" id="address" class="form-control" placeholder="רחוב, מספר בית ועיר" data-i18n-placeholder="address_placeholder"
                                       autocomplete="street-address" required>
                                <div class="invalid-feedback"></div>
                            </div>


                            <hr class="my-4">


                            <!-- ===================== -->
                            <!-- תשלום -->
                            <!-- ===================== -->

                            <h2 class="checkout-step"><span class="step-num">02</span> <span data-i18n="step_payment">פרטי תשלום</span></h2>

                            <!-- מספר כרטיס -->
                            <div class="mb-3">
                                <label for="cardNumber" class="form-label" data-i18n="card_number">מספר כרטיס אשראי</label>
                                <input type="text" id="cardNumber" class="form-control" maxlength="19"
                                       placeholder="1234 5678 9012 3456" inputmode="numeric" autocomplete="off" dir="ltr" required>
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="row">

                                <!-- תוקף -->
                                <div class="col-6 mb-3">
                                    <label for="expiry" class="form-label" data-i18n="expiry">תוקף</label>
                                    <input type="text" id="expiry" class="form-control" maxlength="5" placeholder="MM/YY"
                                           inputmode="numeric" autocomplete="off" dir="ltr" required>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <!-- CVV -->
                                <div class="col-6 mb-3">
                                    <label for="cvv" class="form-label">CVV</label>
                                    <input type="password" id="cvv" class="form-control" maxlength="3" placeholder="123"
                                           inputmode="numeric" autocomplete="off" dir="ltr" required>
                                    <div class="invalid-feedback"></div>
                                </div>

                            </div>

                            <!-- כפתור תשלום -->
                            <button type="submit" id="payButton" class="btn btn-dark w-100 mt-3" data-i18n="pay">
                                ביצוע הזמנה
                            </button>

                            <p class="secure-note" data-i18n="mock_note">תשלום מדומה לצורך הפרויקט – לא מתבצע חיוב אמיתי</p>

                        </form>

                    </div>
                </div>
            </div>


            <!-- ===================== -->
            <!-- סיכום הזמנה -->
            <!-- ===================== -->

            <div class="col-lg-5">

                <div class="summary-box">

                    <div>

                        <h2 data-i18n="summary_title">סיכום הזמנה</h2>

                        <!-- JS יכניס לכאן את המוצרים -->
                        <div id="orderSummary"></div>

                        <div class="summary-row mt-2">
                            <span data-i18n="shipping">משלוח</span>
                            <span data-i18n="free">חינם</span>
                        </div>

                        <div class="summary-total">
                            <span data-i18n="total">סה"כ</span>
                            <strong id="totalPrice">0 ₪</strong>
                        </div>

                        <div class="text-center mt-4">
                            <a href="cart.html" class="link-action" data-i18n="edit_cart">עריכת הסל</a>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/products.js"></script>
    <script src="js/checkout.js"></script>

</body>
</html>
