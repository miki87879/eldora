<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה לחנות</title>

    <!-- Bootstrap (גרסת RTL) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                <div class="card shadow-lg border-0">
                    <div class="card-body p-4 p-md-5">

                        <h1 class="h3 text-center mb-2">ברוכים הבאים לחנות 🛒</h1>

                        <!-- טופס כניסה - מוצג כשאין משתמש שמור -->
                        <div id="loginSection">
                            <p class="text-center text-muted mb-4">כדי להתחיל לקנות, הכניסו את שמכם המלא</p>

                            <form id="loginForm" novalidate>
                                <div class="mb-3">
                                    <label for="fullName" class="form-label">שם מלא</label>
                                    <input type="text" id="fullName" class="form-control form-control-lg"
                                           placeholder="לדוגמה: ישראל ישראלי" maxlength="40" autocomplete="name">
                                    <div class="invalid-feedback" id="nameError"></div>
                                </div>

                                <div class="d-grid gap-2">
                                    <button type="submit" class="btn btn-primary btn-lg">כניסה לחנות</button>
                                    <button type="reset" class="btn btn-outline-secondary">ניקוי</button>
                                </div>
                            </form>
                        </div>

                        <!-- מוצג כשהמשתמש כבר נכנס בעבר -->
                        <div id="welcomeSection" class="text-center d-none">
                            <p class="fs-5 mt-3">שלום, <strong class="user-name"></strong>!</p>
                            <p class="text-muted">טוב לראות אותך שוב</p>

                            <div class="d-grid gap-2">
                                <a href="products.html" class="btn btn-success btn-lg">המשך לחנות</a>
                                <button type="button" class="btn btn-outline-danger logout-btn">לא אני – החלפת משתמש</button>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="user.js"></script>
</body>
</html>
